<title>🎵🌮 Musical Taco Night Headcount</title>
<style>
  :root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--mute:#6e6e73;--line:#e3e1dc;--acc:#2f6f4f;--warn:#b3261e}
  @media (prefers-color-scheme:dark){:root{--bg:#161617;--card:#1f1f21;--ink:#f2f2f2;--mute:#9a9aa0;--line:#333336;--acc:#6fcf97;--warn:#ff8a80}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px 6px}
  h1{font-size:20px;margin:0;font-weight:650}
  .wrap{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:12px 24px 24px}
  @media (max-width:760px){.wrap{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  textarea{width:100%;min-height:440px;border:0;outline:0;resize:vertical;background:transparent;color:var(--ink);font:14px/1.6 ui-monospace,"SF Mono",Menlo,monospace}
  .hint{color:var(--mute);font-size:12.5px;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
  .total{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  .big{flex:1;min-width:150px;border:1px solid var(--line);border-radius:10px;padding:12px}
  .big .lbl{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .big .num{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--acc)}
  .big .sub{color:var(--mute);font-size:12.5px}
  .sec{margin-top:12px}
  .sec h2{font-size:14px;margin:0 0 4px;display:flex;justify-content:space-between;font-weight:650}
  .sec h2 span{font-variant-numeric:tabular-nums}
  .row{display:flex;justify-content:space-between;color:var(--mute);font-size:13.5px;padding:2px 0;border-bottom:1px dashed var(--line)}
  .row b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
  .bad{color:var(--warn)}
  button{font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  button.armed{background:var(--warn);color:#fff;border-color:var(--warn)}
  .saved{color:var(--mute);font-size:12px;margin-right:10px}
</style>
</head>
<body>
<header>
  <h1>🎵🌮 Musical Taco Night Headcount</h1>
  <div><span class="saved" id="saved"></span><button id="clear">Clear</button></div>
</header>
<div class="wrap">
  <div class="card">
    <textarea id="in" spellcheck="false" placeholder="Adults
12 Evite
2 Neighbors
1-3 Coworker +1

Kids
3 Evite

Not Eating
1 Driver"></textarea>
    <div class="hint">A line starting with a number or range (<code>2</code>, <code>1-3</code>) is a guest line. Any other line starts a new group. A group named with "not eating" counts in the total but not the eating count. Saves automatically.</div>
  </div>
  <div class="card" id="out"></div>
</div>
<script>
const KEY='headcount-v1';
const $in=document.getElementById('in'),$out=document.getElementById('out'),$saved=document.getElementById('saved'),$clear=document.getElementById('clear');
let mem='';
function load(){try{return localStorage.getItem(KEY)??''}catch(e){return mem}}
function save(v){mem=v;try{localStorage.setItem(KEY,v);$saved.textContent='Saved'}catch(e){$saved.textContent='Not saved (storage blocked)'}}
const SAMPLE='';
const fmt=(a,b)=>a===b?String(a):a+'–'+b;
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function parse(text){
  const groups=[];let cur=null;
  for(const raw of text.split('\n')){
    const line=raw.trim(); if(!line) continue;
    const m=line.match(/^(\d+)\s*(?:[-–—]|to)?\s*(\d+)?\s*(.*)$/);
    if(m && /^\d/.test(line)){
      let lo=+m[1],hi=m[2]!==undefined?+m[2]:lo; if(hi<lo)[lo,hi]=[hi,lo];
      if(!cur){cur={name:'Guests',items:[]};groups.push(cur)}
      cur.items.push({lo,hi,label:m[3]||''});
    }else{
      const name=line.replace(/\s*\d+\s*[-–—]\s*\d+\s*$|\s*\d+\s*$/,'').trim()||line;
      if(/^headcount$/i.test(name)) continue;
      cur={name,items:[],notEating:/not\s*eating/i.test(name)};groups.push(cur);
    }
  }
  return groups.filter(g=>g.items.length);
}
function render(){
  const gs=parse($in.value);
  let tLo=0,tHi=0,eLo=0,eHi=0,html='';
  for(const g of gs){
    const lo=g.items.reduce((s,i)=>s+i.lo,0),hi=g.items.reduce((s,i)=>s+i.hi,0);
    tLo+=lo;tHi+=hi;if(!g.notEating){eLo+=lo;eHi+=hi}
    html+=`<div class="sec"><h2>${esc(g.name)}<span>${fmt(lo,hi)}</span></h2>`+
      g.items.map(i=>`<div class="row"><span>${esc(i.label)||'&nbsp;'}</span><b>${fmt(i.lo,i.hi)}</b></div>`).join('')+'</div>';
  }
  const mid=(a,b)=>Math.round((a+b)/2);
  const top=`<div class="total">
    <div class="big"><div class="lbl">Total people</div><div class="num">${fmt(tLo,tHi)}</div><div class="sub">likely ~${mid(tLo,tHi)}</div></div>
    <div class="big"><div class="lbl">Eating</div><div class="num">${fmt(eLo,eHi)}</div><div class="sub">likely ~${mid(eLo,eHi)}</div></div>
  </div>`;
  $out.innerHTML=gs.length?top+html:'<div class="sub" style="color:var(--mute)">Type guests on the left.</div>';
}
let t;$in.addEventListener('input',()=>{render();clearTimeout(t);t=setTimeout(()=>save($in.value),250)});
let armed=null;
$clear.addEventListener('click',()=>{
  if(!armed){$clear.textContent='Click again to clear';$clear.classList.add('armed');armed=setTimeout(()=>{armed=null;$clear.textContent='Clear';$clear.classList.remove('armed')},3000);return}
  clearTimeout(armed);armed=null;$clear.textContent='Clear';$clear.classList.remove('armed');
  $in.value='';save('');render();$in.focus();
});
let first=load(); let seeded=false;
try{seeded=localStorage.getItem(KEY+'-seeded')==='1'}catch(e){}
if(!first&&!seeded){first=SAMPLE;try{localStorage.setItem(KEY+'-seeded','1')}catch(e){}save(first)}
$in.value=first;render();
</script>
</body>
</html>
